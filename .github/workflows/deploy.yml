# Tự build và đưa app lên GitHub Pages mỗi khi đẩy code lên nhánh main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Máy chủ Supabase dùng chung cho mọi quán (GitHub › Settings › Secrets and variables › Actions › Variables).
          # Để trống thì app chạy chế độ 1 máy như cũ.
          # đọc ở tab Variables, nếu không có thì đọc ở tab Secrets
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Kiểm tra đã gắn máy chủ
        run: |
          if grep -rq "supabase.co" dist/assets; then echo "✅ Đã gắn máy chủ Supabase vào app"; else echo "::warning::Chưa có VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY — app đang chạy chế độ 1 máy"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
