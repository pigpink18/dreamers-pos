<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1eb" />
    <!-- Chạy như app trên iPhone/iPad khi "Thêm vào Màn hình chính" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dreamers" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Áp theme trước khi vẽ để không bị nháy màu
      try { var a = JSON.parse(localStorage.getItem('dreamers:appearance')) || {}; document.documentElement.dataset.theme = a.theme || 'latte'; document.documentElement.dataset.motion = a.motion || 'full' } catch (e) {}
    </script>
    <title>Dreamers Home & Coffee POS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
